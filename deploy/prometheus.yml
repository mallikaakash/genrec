global:
  scrape_interval: 15s

scrape_configs:
  - job_name: genrec
    static_configs:
      - targets: ['api:8080']

  # vLLM exposes its own rich metrics: KV cache usage, running/waiting queue
  # depth, time-to-first-token, throughput. Worth scraping even though our
  # workload is prefill-only, because queue depth tells you if you are batching.
  - job_name: vllm
    static_configs:
      - targets: ['vllm:8000']
